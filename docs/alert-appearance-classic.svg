<svg width="800" height="64" viewBox="0 0 800 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Classic alert appearance preview</title>
  <desc id="desc">A classic success alert with a pale green background, dark green border, text, and a close button.</desc>
