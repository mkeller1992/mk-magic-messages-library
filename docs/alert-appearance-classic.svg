    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
  </filter>
  <rect x="23" y="12" width="760" height="43" rx="4" fill="#c3e6cb" stroke="#155724" filter="url(#classicShadow)"/>
  <text x="43" y="40" fill="#155724" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400">Success!</text>
  <path d="M753 28l10 10M763 28l-10 10" stroke="#155724" stroke-width="4" stroke-linecap="round"/>
