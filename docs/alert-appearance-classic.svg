<svg width="800" height="244" viewBox="0 0 800 244" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Classic alert appearance preview</title>
  <desc id="desc">Four classic alerts showing success, info, warning, and error appearances.</desc>
  <defs>
    <filter id="classicShadow" x="-6%" y="-20%" width="112%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="23" y="12" width="760" height="43" rx="4" fill="#c3e6cb" stroke="#155724" filter="url(#classicShadow)"/>
  <text x="43" y="40" fill="#155724" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400">Success!</text>
  <path d="M753 28l10 10M763 28l-10 10" stroke="#155724" stroke-width="4" stroke-linecap="round"/>

  <rect x="23" y="67" width="760" height="43" rx="4" fill="#b8daff" stroke="#004085" filter="url(#classicShadow)"/>
  <text x="43" y="95" fill="#004085" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400">Info!</text>
  <path d="M753 83l10 10M763 83l-10 10" stroke="#004085" stroke-width="4" stroke-linecap="round"/>

  <rect x="23" y="122" width="760" height="43" rx="4" fill="#ffeeba" stroke="#856404" filter="url(#classicShadow)"/>
  <text x="43" y="150" fill="#856404" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400">Warning!</text>
  <path d="M753 138l10 10M763 138l-10 10" stroke="#856404" stroke-width="4" stroke-linecap="round"/>

  <rect x="23" y="177" width="760" height="43" rx="4" fill="#f8d7da" stroke="#721c24" filter="url(#classicShadow)"/>
  <text x="43" y="205" fill="#721c24" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="400">Error!</text>
  <path d="M753 193l10 10M763 193l-10 10" stroke="#721c24" stroke-width="4" stroke-linecap="round"/>
</svg>
