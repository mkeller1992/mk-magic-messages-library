@if (alertParams(); as params) {
  <div class="clickable-area">
    @if (isDisplayed()) {
      <div
        #container
        class="alert-container alert-{{ params.type }}"
        animate.enter="alert-enter"
        animate.leave="alert-leave"
        (transitionend)="onContainerTransitionEnd($event)">

        <div class="alert-text" [innerHtml]="params.text | newlineAndTabs"></div>

        <div class="btn-dismiss">
          <i class="fa fa-times"></i>
        </div>
      </div>
    }
  </div>
}
